[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse"
version = "0.1.0"
description = "Local-first retail and supply-chain data intelligence platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "plotly>=5.24,<6",
  "streamlit>=1.40,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
cloud = ["google-cloud-bigquery>=3.25,<4", "google-cloud-pubsub>=2.27,<3", "google-cloud-storage>=2.18,<3", "apache-beam[gcp]>=2.60,<3"]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.8,<1", "pyarrow>=18,<19"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
